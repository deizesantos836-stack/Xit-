
 <!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Fire Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #1b0033, #050008 65%);
      color: white;
    }

    .panel {
      width: 90%;
      max-width: 380px;
      padding: 25px;
      border: 1px solid #ff1744;
      border-radius: 20px;
      background: rgba(10, 10, 18, .94);
      box-shadow: 0 0 30px #ff174455;
      text-align: center;
    }

    .logo {
      font-size: 32px;
      font-weight: 900;
      color: #ff1744;
      text-shadow: 0 0 15px #ff1744;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #aaa;
      margin-bottom: 25px;
    }

    .status {
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 10px;
      background: #15151f;
      border: 1px solid #292938;
      color: #00ff88;
    }

    .button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(90deg, #ff1744, #ff0055);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 0 18px #ff174455;
    }

    .button:active {
      transform: scale(.97);
    }

    .info {
      margin-top: 20px;
      font-size: 12px;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="panel">
    <div class="logo">FREE FIRE</div>
    <div class="subtitle">GAMING PANEL</div>

    <div class="status" id="status">
      ● PAINEL ONLINE
    </div>

    <button class="button" onclick="abrirFreeFire()">
      🎮 ABRIR FREE FIRE
    </button>

    <button class="button" onclick="mostrarStatus()">
      ⚡ VER STATUS
    </button>

    <div class="info">
      Painel visual para uso pessoal.
    </div>
  </div>

  <script>
    function abrirFreeFire() {
      // Tenta abrir o aplicativo usando o esquema de URL.
      window.location.href = "freefire://";

      setTimeout(() => {
        document.getElementById("status").innerText =
          "⚠ Se não abriu, o Free Fire pode não permitir este link no seu aparelho.";
      }, 1500);
    }

    function mostrarStatus() {
      document.getElementById("status").innerText =
        "● PAINEL ATIVO — PRONTO PARA JOGAR";
    }
  </script>

</body>
</html>
